plugins { id 'com.android.application' }

android {
    namespace 'io.github.omi.wallpaper'
    compileSdk 36
    buildFeatures { buildConfig true }
    defaultConfig {
        applicationId 'io.github.omi.wallpaper'
        minSdk 29
        targetSdk 36
        versionCode 1
        versionName '0.1.0'
        testInstrumentationRunner 'io.github.omi.wallpaper.EngineInstrumentation'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildTypes {
        release { minifyEnabled false }
    }
    lint { abortOnError true }
}
dependencies { testImplementation 'junit:junit:4.13.2' }
